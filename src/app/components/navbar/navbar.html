<p>Cart: {{ cartService.cart.length }}</p>

@if ((currentUrl | async) !== '/cart') {
  <button [routerLink]="'/cart'">Open Cart</button>
}


<button [routerLink]="'/favorites'">Open favorites</button>



@if (userGet | async) {
  <button (click)="logout()">Logout</button>
} @else {
  <button (click)="login()">Login</button>
  <button (click)="register()">Register</button>
}
