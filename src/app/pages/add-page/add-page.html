<button routerLink="/">Return</button>
<form [formGroup]="myForm" (ngSubmit)="onSubmit()">
  <label for="name">Name:</label>
  <input type="text" id="name" formControlName="title">

<!--  <label for="id">Id:</label>-->
<!--  <input type="number" id="id" formControlName="id">-->

  <label for="price">Price:</label>
  <input type="number" id="price" formControlName="price">

  <label for="category">category:</label>
  <input type="text" id="category" formControlName="category">

  <label for="imageUrl">imageUrl:</label>
  <input type="text" id="imageUrl" formControlName="thumbnail">

  <label for="rating">rating:</label>
  <input type="number" id="rating" formControlName="rating">

  <label for="description">description:</label>
  <input type="text" id="description" formControlName="description">
  <button type="submit" [disabled]="myForm.invalid || isLoading">Submit</button>
  @if (isLoading) {
    <p>тест</p>
  }
</form>
