<div class="add-page">
<div class="page-header">
  <h1>Add Product</h1>
  <p>Create a new product for your store</p>
</div>
<form class="add-form" [formGroup]="myForm" (ngSubmit)="onSubmit()">
  <div class="form-grid">
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" formControlName="title">
    </div>
    <div class="form-group">
      <label for="price">Price:</label>
      <input type="number" id="price" formControlName="price">
    </div>
    <div class="form-group">
      <label for="brand">Brand:</label>
      <input
        type="text"
        id="brand"
        formControlName="brand"
        placeholder="e.g. Dior"
      >
    </div>
    <div class="form-group">
      <label for="discountPercentage">Discount (%):</label>
      <input
        type="number"
        id="discountPercentage"
        formControlName="discountPercentage"
        min="0"
        max="100"
      >
    </div>
    <div class="form-group">
      <label for="category">Category:</label>
      <select id="category" formControlName="category">
        <option value="">Select category</option>
        <option value="beauty">Beauty</option>
        <option value="fragrances">Fragrances</option>
        <option value="furniture">Furniture</option>
        <option value="groceries">Groceries</option>
      </select>
    </div>
    <div class="form-group">
      <label for="imageUrl">ImageUrl:</label>
      <input type="text" id="imageUrl" formControlName="thumbnail">
    </div>
  </div>
  <div class="form-group">
    <label for="rating">Rating:</label>
    <input type="number" id="rating" formControlName="rating">
  </div>
  <div class="form-group">
    <label for="description">description:</label>
    <input type="text" id="description" formControlName="description">
  </div>
  <div class="form-group">
    <label for="stock">Stock:</label>
    <input type="number" id="stock" min="0" formControlName="stock">
  </div>
  <div class="add-form-buttons">
    <button class="add-form-submit" type="submit" [disabled]="myForm.invalid || isLoading">Submit</button>
    <button class="add-form-return" routerLink="/">Return</button>
    @if (auth.isAdmin$ | async) {
      <button routerLink="/admin" class="add-form-admin">
        Back to Admin Panel
      </button>
    }
  </div>
  @if (isLoading) {
    <p>тест</p>
  }
</form>
</div>
