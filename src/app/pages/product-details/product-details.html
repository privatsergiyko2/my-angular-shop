<div class="container mt-4">

  <h1>{{ product?.title }}</h1>

  <p>{{ product?.description }}</p>

  <p>Price: ${{ product?.price }}</p>

  <p>Category: {{ product?.category }}</p>

  <p>⭐ {{ product?.rating }}</p>

  <button class="btn btn-secondary" routerLink="/">
    Back to products
  </button>

</div>
