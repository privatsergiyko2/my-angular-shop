<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-title">Admin Panel</div>

    <a routerLink="/admin" routerLinkActive="active">Products</a>
    <a routerLink="/customers" routerLinkActive="active">Customers</a>
    <a routerLink="/admin/reviews" routerLinkActive="active">Reviews</a>
  </aside>

  <main class="admin-main">
    <div class="content-header">
      <div>
        <h1>Products</h1>
        <p>Manage your BeautyStore product catalog</p>
      </div>

      <button class="add-btn" routerLink="/add-page">
        + Add product
      </button>

      <button (click)="deleteSelectedProducts()" class="delete-btn">
        Delete selected
      </button>
    </div>
    <div class="sort-wrapper">
      <span>Sort by:</span>
      <app-sort [sort]="sortOptions" (sortChange)="sort.set($event)"></app-sort>
    </div>


    <app-table
      [products]="sortedProducts()"
      [selectedProducts]="selectedProducts"
      (toggleProduct)="toggleProduct($event)"
      (toggleAll)="toggleAllProducts($event)"
      (removeProduct)="removeProduct($event)"
      (editProduct)="editProduct($event)"
    ></app-table>

  </main>
</div>
