<div class="cart-container">
  <div class="cart-header-section">
    <h1 class="cart-title">{{ stepTitles[activeStepIndex].title }}</h1>
    <p class="cart-subtitle">{{ stepTitles[activeStepIndex].subtitle }}</p>


    <mat-stepper #stepper [linear]="true" (selectionChange)="onStepChange($event)" class="custom-stepper">
      <mat-step label="Order" [completed]="cartService.cart.length > 0">
        <ng-template matStepContent>
          <app-order [stepper]="stepper"></app-order>
        </ng-template>
      </mat-step>

      <mat-step label="Shipping" [stepControl]="shippingForm">
        <ng-template matStepContent>
          <app-shipping [stepper]="stepper" [shippingForm]="shippingForm"></app-shipping>
        </ng-template>
      </mat-step>

      <mat-step label="Payment" [completed]="isPaid">
        <ng-template matStepContent>
          <app-payment [stepper]="stepper"></app-payment>
        </ng-template>
      </mat-step>

      <mat-step label="Review">
        <ng-template matStepContent>
          <app-order-success></app-order-success>
        </ng-template>
      </mat-step>

    </mat-stepper>
  </div>
</div>
