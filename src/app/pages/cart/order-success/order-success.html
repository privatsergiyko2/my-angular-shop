<div class="order-success-container">
  <p class="order-success-title">Order successfully placed</p>
  <p class="order-success-info">Order name: {{ this.order.name }}</p>
  <p class="order-success-info">Total: {{ this.order.total }}</p>
  @for (item of order.items; track item.product.id) {
    <div  class="order-success-product">
      <p>{{ item.product.title }}</p>
      <p>Quantity: {{ item.quantity }}</p>
      <p>Price: {{ item.product.price }}</p>
    </div>
  }

  <button  class="order-success-back" (click)="goToProducts()">Back to main page</button>
</div>
